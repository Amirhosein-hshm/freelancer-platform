[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "media-project"
version = "0.1.0"
description = "Freelance/project platform backend - Phase 1 (domain + application)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "pyjwt",
    "argon2-cffi",
    "python-multipart",
    "filetype",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-asyncio",
    "httpx",
    "mypy",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers -m 'not integration'"
markers = [
    "unit: fast unit tests (default for all tests in this project)",
    "slow: tests that execute slower (should not exist in Phase 1)",
    "integration: tests that require a real Postgres (via docker-compose db service)",
]

[tool.coverage.run]
branch = true
source = ["app.domain", "app.application"]
omit = [
    "app/application/*/mapping.py",
    "app/application/*/status_history.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "src"
files = [
    "src/app/domain",
    "src/app/application",
]

[[tool.mypy.overrides]]
module = ["app.infrastructure.*", "app.presentation.*", "app.bootstrap.*"]
strict = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["filetype"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # Depends() in argument defaults is the standard FastAPI DI idiom

[tool.ruff.lint.per-file-ignores]
# Alembic generates these; keep them syntactically valid but skip lint churn.
"src/app/infrastructure/migrations/versions/*.py" = ["E501", "UP007", "F401", "I001", "UP035"]
